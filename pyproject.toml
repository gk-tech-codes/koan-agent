[project]
name = "koan-agent"
version = "0.1.0"
description = "A personal AI agent that learns your workflows and gets better every session"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tomli>=2.0; python_version<'3.12'",
]

[project.scripts]
koan = "cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
